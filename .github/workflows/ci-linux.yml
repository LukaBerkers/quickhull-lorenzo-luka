name: ci-linux

# Trigger the workflow on push or pull request
on:
  # pull_request:
  #   branches: [master]
  push:
    paths:
      - '.github/workflows/ci-linux.yml'
      - 'cabal.project'
      - 'cabal.freeze'
      - '*.cabal'
      - 'app/**'
      - 'src/**'
      - 'test/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc:
          - '9.4.7'

    steps:
      - uses: actions/checkout@v3

      - uses: actions/checkout@v3
        with:
          repository: actions/cache
          path: .github/actions/cache-always
          ref: v3

      # Tweak `action.yml` of `actions/cache@v3` to remove its `post-if`
      # condition, making it default to `post-if: always()`.
      - name: Set up actions/cache-always@v3
        run: |
          sed -i -e '/ post-if: /d' .github/actions/cache-always/action.yml

      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Freeze
        run: cabal freeze

      - name: actions/cache-always@v3
        uses: ./.github/actions/cache-always
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-${{ hashFiles('quickhull.cabal') }}-
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('quickhull.cabal') }}-
            ${{ runner.os }}-

      - name: Install LLVM
        run: sudo apt-get -y install llvm-15-dev

      - name: Install dependencies
        run: sudo apt-get -y install libffi7 libffi-dev freeglut3-dev libgmp-dev libfreetype6-dev libgtk-3-dev libglfw3-dev

      - name: Build dependencies
        run: cabal build --only-dependencies

      - name: Build
        run: cabal build

      - name: Test
        run: cabal run quickhull-test

      - name: Bench
        run: cabal run quickhull-test -- --benchmark --random 100000 --seed 1234
